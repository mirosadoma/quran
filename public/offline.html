<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#f6f3ec">
        <title>غير متصل · Offline</title>
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('theme');
                    var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);

                    if (dark) {
                        document.documentElement.classList.add('dark');
                        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08110f');
                    }
                } catch (e) {}
            })();
        </script>
        <style>
            :root {
                --canvas: #f6f3ec;
                --surface: #ffffff;
                --line: #e9e3d6;
                --ink: #1b2a25;
                --muted: #68736e;
                --button: #16634e;
                --button-hover: #144f40;
                --icon-bg: #effaf5;
                --icon: #16634e;
                --gold: #c98f2f;
                --pattern: rgba(11, 59, 49, 0.07);
                color-scheme: light;
            }

            .dark {
                --canvas: #08110f;
                --surface: #0f1b18;
                --line: #1e322c;
                --ink: #e6eee9;
                --muted: #8da39a;
                --button: #1b7c60;
                --button-hover: #2a9a77;
                --icon-bg: rgba(42, 154, 119, 0.12);
                --icon: #82d2b3;
                --gold: #d8a747;
                --pattern: rgba(216, 167, 71, 0.07);
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                min-height: 100%;
                margin: 0;
            }

            body {
                display: grid;
                min-height: 100dvh;
                place-items: center;
                padding: 24px 16px;
                background: var(--canvas);
                color: var(--ink);
                font-family: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .pattern {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                color: var(--pattern);
                pointer-events: none;
            }

            .card {
                position: relative;
                width: 100%;
                max-width: 420px;
                padding: 40px 28px 28px;
                border: 1px solid var(--line);
                border-radius: 28px;
                background: var(--surface);
                box-shadow: 0 24px 60px -28px rgba(8, 37, 30, 0.35);
                text-align: center;
            }

            .icon {
                display: grid;
                width: 72px;
                height: 72px;
                margin: 0 auto 22px;
                place-items: center;
                border-radius: 24px;
                background: var(--icon-bg);
                color: var(--icon);
            }

            .ornament {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-bottom: 14px;
                color: var(--gold);
            }

            .ornament span {
                width: 32px;
                height: 1px;
                background: currentColor;
                opacity: 0.6;
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
                line-height: 1.4;
            }

            p {
                margin: 10px 0 0;
                color: var(--muted);
                line-height: 1.8;
            }

            button {
                display: inline-flex;
                width: 100%;
                height: 48px;
                margin-top: 26px;
                align-items: center;
                justify-content: center;
                gap: 8px;
                border: 0;
                border-radius: 14px;
                background: var(--button);
                color: #fff;
                font: inherit;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.15s;
            }

            button:hover {
                background: var(--button-hover);
            }

            .english {
                margin-top: 24px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                direction: ltr;
                font-size: 0.875rem;
            }

            .english strong {
                display: block;
                color: var(--ink);
                font-size: 0.95rem;
            }

            .english p {
                margin-top: 4px;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <svg class="pattern" aria-hidden="true">
            <defs>
                <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
                    <path
                        d="M19.2 19.2H44.8V44.8H19.2ZM32 13.9L50.1 32L32 50.1L13.9 32ZM32 0V13.9M32 50.1V64M0 32H13.9M50.1 32H64M0 8.96L8.96 0M55.04 0L64 8.96M64 55.04L55.04 64M8.96 64L0 55.04"
                        fill="none"
                        stroke="currentColor"
                    />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#stars)" />
        </svg>

        <main class="card">
            <div class="icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h.01" />
                    <path d="M8.5 16.429a5 5 0 0 1 7 0" />
                    <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
                    <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
                    <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
                    <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
                    <path d="m2 2 20 20" />
                </svg>
            </div>

            <div class="ornament" aria-hidden="true">
                <span></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="1" />
                    <rect x="6" y="6" width="12" height="12" rx="1" transform="rotate(45 12 12)" />
                </svg>
                <span></span>
            </div>

            <h1>لا يوجد اتصال بالإنترنت</h1>
            <p>تحقق من اتصالك ثم أعد المحاولة، وستُفتح الصفحة تلقائياً عند عودة الاتصال.</p>

            <button type="button" onclick="location.reload()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                </svg>
                إعادة المحاولة · Try again
            </button>

            <div class="english">
                <strong>You're offline</strong>
                <p>Check your connection and try again. The page opens automatically once you're back online.</p>
            </div>
        </main>

        <script>
            window.addEventListener('online', function () {
                location.reload();
            });
        </script>
    </body>
</html>
